[project]
name = "sportygroup-bet-automation"
version = "0.1.0"
description = "MVP UI + API automation for the Single Bet Placement feature"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
